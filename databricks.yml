bundle:
  name: databricks_pipelines

variables:
  catalog:
    description: Unity Catalog catalog used by this bundle's tables.
    default: main
  schema:
    description: Schema (database) that holds the orders bronze/silver/gold tables.
    default: orders

resources:
  pipelines:
    orders_etl_pipeline:
      name: orders_etl_${bundle.target}
      catalog: ${var.catalog}
      target: ${var.schema}
      serverless: true
      development: true
      continuous: false
      libraries:
        - file:
            path: ./src/pipelines/orders_etl.py

  jobs:
    sync_lakebase_job:
      name: sync_lakebase_${bundle.target}
      tasks:
        - task_key: sync_lakebase
          spark_python_task:
            python_file: ./src/jobs/sync_lakebase.py
          # Serverless compute (no job_cluster_key / new_cluster - this
          # workspace only allows serverless). Extra pip dependencies for a
          # serverless task go in environments: below, not cluster libraries.
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
            # psycopg2 is not preinstalled; sync_lakebase.py needs it for the
            # ON CONFLICT upsert against LakeBase/Postgres.
            dependencies:
              - psycopg2-binary
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED

# `workspace.host` is intentionally omitted for both targets: the CLI resolves
# the workspace from the DATABRICKS_HOST / DATABRICKS_TOKEN env vars (set as
# GitHub Actions environment secrets, or via a local `databricks auth login`
# profile). Add an explicit `workspace: {host: https://<workspace>.azuredatabricks.net}`
# per target if dev and prod live in different workspaces and you don't want
# to rely on env vars to select between them.
targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: main
      schema: orders_dev
    resources:
      jobs:
        sync_lakebase_job:
          schedule:
            pause_status: PAUSED

  prod:
    mode: production
    variables:
      catalog: main
      schema: orders
    resources:
      pipelines:
        orders_etl_pipeline:
          development: false
      jobs:
        sync_lakebase_job:
          schedule:
            pause_status: UNPAUSED
    permissions:
      - level: CAN_MANAGE_RUN
        group_name: data-engineers
